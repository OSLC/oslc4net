# Documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/OSLC4Net_SDK" # Location of package manifests
    open-pull-requests-limit: 99
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    commit-message:
      prefix: "build"
    groups:
      aspire-deps:
        patterns:
          - "Aspire.AppHost.Sdk"
          - "Aspire.Hosting.*"
      test-deps:
        patterns:
          - "xunit*"
          - "MSTest.*"
          - "Microsoft.NET.Test.*"
          - "TUnit"
          - "Verify.TUnit"
          - "Microsoft.Testing.Extensions.*"
      # Keep packages pinned to the .NET runtime version (10.0.x) together.
      # Keep this list aligned with packages using $(DotnetRuntimeVersion).
      dotnet-runtime-deps:
        patterns:
          - "Microsoft.AspNetCore.OpenApi"
          - "Microsoft.AspNetCore.TestHost"
          - "Microsoft.Extensions.Configuration.Json"
          - "Microsoft.Extensions.DependencyInjection"
          - "Microsoft.Extensions.Hosting"
          - "Microsoft.Extensions.Hosting.Abstractions"
          - "Microsoft.Extensions.Logging"
          - "Microsoft.Extensions.Logging.Abstractions"
          - "Microsoft.Extensions.Logging.Console"
      # often get updates in lockstep with dotnet
      test-ms-essential:
        patterns:
          - "Microsoft.Extensions.*"
          - "System.Configuration.*"
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    open-pull-requests-limit: 99
    cooldown:
      default-days: 2
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build"
